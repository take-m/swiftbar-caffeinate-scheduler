name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Any job that needs write access must opt in itself.
permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck -x ./*.sh tests/*.sh
      - name: Check for bash 3.2 incompatibilities
        run: ./tests/lint_bash32.py ./*.sh tests/*.sh
      - name: Check translation catalogs
        run: ./tests/test_i18n.py caffeinate-scheduler.30s.sh
      - name: Check version consistency
        run: ./tests/test_version.sh

  format:
    name: shfmt
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=mvdan/sh
      SHFMT_VERSION: 3.13.1
      SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: Check formatting
        run: shfmt -d -i 4 -ci ./*.sh tests/*.sh

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show bash version
        run: bash --version | head -n 1
      - name: Run schedule tests
        run: ./tests/test_schedule.sh
      - name: Smoke test the plugin output
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP_DIR/config"
          export SWIFTBAR_PLUGIN_DATA_PATH="$RUNNER_TEMP_DIR/state"
          out="$(./caffeinate-scheduler.30s.sh </dev/null)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q -- '---'
          test -f "$XDG_CONFIG_HOME/caffeinate-scheduler/config.sh"
